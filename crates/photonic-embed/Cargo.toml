[package]
name = "photonic-embed"
version.workspace = true
edition = "2021"
license.workspace = true

[dependencies]
# Preserve ONNX downloads and online model caching with the patched Rustls verifier.
fastembed = { version = "4", default-features = false, features = ["ort-download-binaries"] }
anyhow = { workspace = true }
# The supported async model downloader uses the same Hugging Face disk cache
# through Reqwest, whose maintained root loader honors OS/SSL_CERT_FILE trust.
hf-hub = { version = "0.4", default-features = false, features = ["tokio", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
tokio = { workspace = true }

[package]
name = "photonic-render"
version.workspace = true
edition = "2021"
license.workspace = true

[dependencies]
photonic-core = { path = "../photonic-core" }
wgpu = { workspace = true }
winit = { workspace = true }
lyon = { workspace = true }
glam = { workspace = true }
glyphon = { workspace = true }
bytemuck = { workspace = true }
image = { workspace = true }
tokio = { workspace = true }
kurbo = { workspace = true }
pollster = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
ico = "0.3"
# Glyph outline extraction for text-on-path. Pinned to 0.21 so it unifies with
# the ttf-parser that cosmic-text/rustybuzz (via glyphon) already resolve.
ttf-parser = "0.21"

[dev-dependencies]
serde_json = { workspace = true }
# wgpu's own shader compiler — lets tests parse + validate the inline WGSL
# without a GPU device. Version tracks wgpu 22's naga (22.x) so it unifies.
naga = { version = "22", features = ["wgsl-in"] }

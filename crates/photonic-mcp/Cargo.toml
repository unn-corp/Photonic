[package]
name = "photonic-mcp"
version.workspace = true
edition = "2021"
license.workspace = true

[dependencies]
photonic-core = { path = "../photonic-core" }
photonic-matte = { path = "../photonic-matte" }
photonic-render = { path = "../photonic-render" }
wgpu = { workspace = true }
pollster = { workspace = true }
glyphon = { workspace = true }
photonic-video = { path = "../photonic-video" }
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
subtle = "2"
uuid = { workspace = true }
clap = { workspace = true }
mlua = { workspace = true }
image = { workspace = true }
base64 = "0.22"
crossbeam-channel = "0.5"
regex = "1"
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
kurbo = { workspace = true }

[dev-dependencies]
# `ServiceExt::oneshot` (drives the router without binding a socket) lives
# behind `util`; the workspace `tower` dep is featureless.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio = { workspace = true, features = ["test-util"] }

# Build Photonic release binaries from reviewed version tags, then require
# release-environment approval before signing and publishing them.
#
# Trigger:  git tag v0.2.0 && git push origin v0.2.0
# Result:   a GitHub Release with a signed binary archive per platform, which
#           the in-app self-updater downloads and verifies.
#
# Required secret in the protected `release` environment:
#   PHOTONIC_SIGNING_KEY = base64 of release/photonic-signing.priv
#   (the ed25519 private key; the public key is committed and embedded in the app)
# Configure required reviewers (with self-review disabled), allow only v* tags
# to deploy, and protect v* tag creation with a repository ruleset.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ZIPSIGN_VERSION: "0.2.1"
  ZIPSIGN_SHA256: bc5d02b6a44b677c4c412fca9eb5c9b08f255692b30f6943248437b6add1f5c6

jobs:
  # Tags are accepted only when they resolve to a commit already reachable
  # from protected main. This is the approved release-branch path; repository
  # administrators must also protect v* tags with a tag ruleset.
  validate_release:
    name: Validate release provenance
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Check out full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Require a reviewed release commit
        shell: bash
        env:
          DEFAULT_BRANCH: main
          TAG_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" != "tag" || ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::release runs require a version tag such as v1.2.3" >&2
            exit 1
          fi

          git fetch --no-tags origin \
            "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          tag_commit="$(git rev-parse --verify "$TAG_COMMIT^{commit}")"
          ref_commit="$(git rev-parse --verify "refs/tags/$GITHUB_REF_NAME^{commit}")"
          main_ref="refs/remotes/origin/$DEFAULT_BRANCH"

          if [[ "$tag_commit" != "$ref_commit" ]]; then
            echo "::error::tag ref does not match the triggering commit" >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$tag_commit" "$main_ref"; then
            echo "::error::${GITHUB_REF_NAME} does not point to a commit in protected $DEFAULT_BRANCH" >&2
            exit 1
          fi

          echo "${GITHUB_REF_NAME} points to reviewed commit $tag_commit on $DEFAULT_BRANCH"

  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: validate_release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: photonic-x86_64-unknown-linux-gnu.tar.gz
            archive_kind: tar
            archive_member: photonic
          - os: macos-13
            target: x86_64-apple-darwin
            archive: photonic-x86_64-apple-darwin.tar.gz
            archive_kind: tar
            archive_member: photonic
          - os: macos-14
            target: aarch64-apple-darwin
            archive: photonic-aarch64-apple-darwin.tar.gz
            archive_kind: tar
            archive_member: photonic
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            archive: photonic-x86_64-pc-windows-msvc.zip
            archive_kind: zip
            archive_member: photonic.exe
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.96.0"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release -p photonic-app --target ${{ matrix.target }}

      - name: Package unsigned archive (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-out
          tar -czf "release-out/${{ matrix.archive }}" \
            -C "target/${{ matrix.target }}/release" "${{ matrix.archive_member }}"
          python - "release-out/${{ matrix.archive }}" <<'PY'
          import hashlib
          import pathlib
          import sys

          archive = pathlib.Path(sys.argv[1])
          digest = hashlib.sha256()
          with archive.open("rb") as input_file:
              for chunk in iter(lambda: input_file.read(1024 * 1024), b""):
                  digest.update(chunk)
          archive.with_name(archive.name + ".sha256").write_text(
              f"{digest.hexdigest()}  {archive.name}\n", encoding="ascii"
          )
          PY

      - name: Package unsigned archive (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-out | Out-Null
          $asset = "release-out/${{ matrix.archive }}"
          Compress-Archive -Path "target/${{ matrix.target }}/release/photonic.exe" -DestinationPath $asset
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($asset))" |
            Set-Content -LiteralPath "$asset.sha256" -Encoding ascii

      - name: Upload unsigned archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-${{ matrix.target }}
          path: release-out/*
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 1

  sign_and_publish:
    name: Approve, sign, and publish release
    needs: [validate_release, build]
    runs-on: ubuntu-22.04
    environment:
      name: release
    permissions:
      contents: write
    steps:
      - name: Check out reviewed release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # GitHub silently creates missing environments without protection. Keep
      # this job closed until an administrator completes the release setup.
      - name: Require configured release environment
        env:
          RELEASE_GATE_CONFIGURED: ${{ vars.RELEASE_GATE_CONFIGURED }}
        shell: bash
        run: |
          if [[ "$RELEASE_GATE_CONFIGURED" != "true" ]]; then
            echo "::error::complete the protected release environment setup before publishing" >&2
            exit 1
          fi

      - name: Download all unsigned archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: unsigned-*
          path: unsigned
          merge-multiple: true

      - name: Verify unsigned release artifacts
        run: python .github/scripts/verify-release-artifacts.py

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.96.0"

      # Download the exact crates.io source archive, verify its published
      # checksum before extraction, then build only that verified source with
      # its lockfile. No signing secret exists while this code executes.
      - name: Install checksum-verified zipsign
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/zipsign.crate" "$RUNNER_TEMP/zipsign-source" \
            "$ZIPSIGN_VERSION" "$ZIPSIGN_SHA256" <<'PY'
          import hashlib
          import os
          import sys
          import tarfile
          import urllib.request
          from pathlib import Path, PurePosixPath

          crate_path = Path(sys.argv[1])
          source_root = Path(sys.argv[2])
          version = sys.argv[3]
          expected_digest = sys.argv[4]
          url = f"https://static.crates.io/crates/zipsign/zipsign-{version}.crate"
          request = urllib.request.Request(
              url, headers={"User-Agent": "Photonic release workflow"}
          )
          with urllib.request.urlopen(request, timeout=120) as response, crate_path.open("wb") as output:
              total = 0
              while chunk := response.read(1024 * 1024):
                  total += len(chunk)
                  if total > 16 * 1024 * 1024:
                      raise SystemExit("zipsign crate is unexpectedly large")
                  output.write(chunk)

          digest = hashlib.sha256(crate_path.read_bytes()).hexdigest()
          if digest != expected_digest:
              raise SystemExit(
                  f"zipsign crate digest mismatch: expected {expected_digest}, got {digest}"
              )

          if source_root.exists():
              raise SystemExit("zipsign extraction directory already exists")
          source_root.mkdir(parents=True)
          prefix = f"zipsign-{version}/"
          seen = set()
          with tarfile.open(crate_path, "r:gz") as crate:
              for member in crate.getmembers():
                  name = member.name
                  relative = PurePosixPath(name[len(prefix):]) if name.startswith(prefix) else None
                  if (
                      name != prefix[:-1]
                      and relative is None
                  ) or (
                      relative is not None
                      and (relative.is_absolute() or ".." in relative.parts)
                  ):
                      raise SystemExit("zipsign crate contains an unsafe path")
                  if name in seen or member.issym() or member.islnk():
                      raise SystemExit("zipsign crate contains an unsafe entry")
                  if not (member.isdir() or member.isfile()):
                      raise SystemExit("zipsign crate contains a special file")
                  seen.add(name)
              crate.extractall(source_root)
          print(f"verified zipsign {version} crate ({digest})")
          PY
          cargo install --locked \
            --path "$RUNNER_TEMP/zipsign-source/zipsign-$ZIPSIGN_VERSION" \
            --root "$RUNNER_TEMP/zipsign"
          echo "$RUNNER_TEMP/zipsign/bin" >> "$GITHUB_PATH"

      - name: Verify zipsign version
        shell: bash
        run: |
          set -euo pipefail
          test "$(zipsign --version)" = "zipsign $ZIPSIGN_VERSION"

      # The environment secret is read only after approval and input validation.
      - name: Decode signing key
        env:
          KEY_B64: ${{ secrets.PHOTONIC_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYKEY'
          import base64
          import os
          from pathlib import Path

          encoded = os.environ["KEY_B64"]
          if not encoded:
              raise SystemExit("release environment is missing PHOTONIC_SIGNING_KEY")
          key = base64.b64decode(encoded, validate=True)
          if len(key) != 64:
              raise SystemExit("signing key must be a 64-byte Ed25519 keypair")
          path = Path(os.environ["RUNNER_TEMP"]) / "photonic-signing.priv"
          descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, "wb") as output:
              output.write(key)
          PYKEY

      - name: Sign and verify every archive
        shell: bash
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/photonic-signing.priv"
          derived_public_key="$RUNNER_TEMP/photonic-signing.pub"
          zipsign gen-key "$key_path" "$derived_public_key" --extract
          cmp "$derived_public_key" release/photonic-signing.pub
          for archive in \
            photonic-x86_64-unknown-linux-gnu.tar.gz \
            photonic-x86_64-apple-darwin.tar.gz \
            photonic-aarch64-apple-darwin.tar.gz; do
            zipsign sign tar "unsigned/$archive" "$key_path"
            zipsign verify tar "unsigned/$archive" release/photonic-signing.pub
          done
          archive=photonic-x86_64-pc-windows-msvc.zip
          zipsign sign zip "unsigned/$archive" "$key_path"
          zipsign verify zip "unsigned/$archive" release/photonic-signing.pub

      - name: Remove signing key before publishing
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/photonic-signing.priv" "$RUNNER_TEMP/photonic-signing.pub"

      - name: Extract release notes
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$VER" '
            $0 ~ "^## \\[" ver "\\]" { grab=1; next }
            grab && /^## \\[/ { exit }
            grab { print }
          ' CHANGELOG.md | sed '/./,$!d' > RELEASE_BODY.md
          if [ ! -s RELEASE_BODY.md ]; then
            echo "Photonic $GITHUB_REF_NAME" > RELEASE_BODY.md
          fi

      - name: Publish signed archives
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            unsigned/photonic-x86_64-unknown-linux-gnu.tar.gz
            unsigned/photonic-x86_64-apple-darwin.tar.gz
            unsigned/photonic-aarch64-apple-darwin.tar.gz
            unsigned/photonic-x86_64-pc-windows-msvc.zip
          fail_on_unmatched_files: true
          body_path: RELEASE_BODY.md

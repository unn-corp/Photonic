name: Retain two artifact builds

on:
  workflow_dispatch:
  schedule:
    - cron: '27 */6 * * *'
  # Reviewed metadata-only cleanup: pinned reusable code; no PR checkout or execution.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["CI", "release"]
    types: [completed]

permissions:
  actions: write

jobs:
  prune:
    uses: unn-corp/.github/.github/workflows/artifact-retention.yml@859abab5c6f470cb6f97a64e6cfe52d41107b23c # tested two-build retention

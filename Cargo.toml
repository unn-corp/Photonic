[workspace]
members = [
    "crates/photonic-core",
    "crates/photonic-render",
    "crates/photonic-gui",
    "crates/photonic-mcp",
    "crates/photonic-app",
    "crates/photonic-embed",
    "crates/photonic-matte",
    "crates/photonic-video",
    "tools/spec-extract",
]
resolver = "2"

[workspace.package]
version = "0.2.6"
license = "MIT"

[workspace.dependencies]
# Math / geometry
kurbo = { version = "0.11", features = ["serde"] }
peniko = { version = "0.3", features = ["serde"] }
lyon = "1.0"
geo = "0.28"
nalgebra = "0.33"
glam = { version = "0.29", features = ["serde"] }

# Rendering
wgpu = "22"
winit = "0.30"
egui = "0.29"
egui-wgpu = "0.29"
egui-winit = "0.29"
egui-phosphor = "0.7"
glyphon = "0.6"

# Async / server
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower = "0.5"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Image encoding (canvas screenshots) and raster pixel buffers
image = "0.25"
base64 = "0.22"

# PDF export
pdf-writer = "0.12"
# Flate/zlib compression for embedded PDF image streams
miniz_oxide = "0.8"

# Scripting
mlua = { version = "0.10", features = ["lua54", "vendored"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Error handling
anyhow = "1"
thiserror = "2"

# Utilities
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.3"
bitflags = "2"
smallvec = "1"
roxmltree = "0.20"

# Property-based testing (dev-only; timeline edit-op invariants, 11 §3.1)
proptest = "1"

# ── Build profiles (Linux + Windows top-tier runtime) ─────────────────────────
# Default `release` stays safe for distribution; use `release-perf` when you want
# maximum runtime speed (longer link). `dev-opt` is a fast iterative middle ground.

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = false
strip = "debuginfo"
panic = "abort"
# Windows: avoid /INCREMENTAL noise; Unix: same semantics.
incremental = false

[profile.release-perf]
inherits = "release"
lto = true
codegen-units = 1
# Fat LTO + single CGU for peak inlining on hot graph/eval/decode paths.

[profile.dev-opt]
inherits = "dev"
opt-level = 2
# Keep debuginfo for local profiling of video scrub/play.
